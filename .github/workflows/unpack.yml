name: Unpack project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          rm -rf app lib public supabase package.json tsconfig.json next-env.d.ts .gitignore .env.example
          unzip -o tigry-hockey.zip -d /tmp/tigry
          ROOT=$(find /tmp/tigry -maxdepth 1 -mindepth 1 -type d | head -1)
          cp -r "$ROOT"/. .
          rm -rf /tmp/tigry

      - name: Commit project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Install Tigry Hockey project" || exit 0
          git push
